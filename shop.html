<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Borgazi ART</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <header class="site-header" data-header></header>
  <div class="scrim"></div>
  <main class="page">
    <h1 class="page-title">Shop</h1>
    <p class="statement">Prints, books, and studio objects. Connect these cards to a real storefront when you are ready to sell.</p>
    <div class="grid">
      <article class="card">
        <img src="https://images.unsplash.com/photo-1579762715118-a6f1d4b934f1?auto=format&fit=crop&w=800&q=80" alt="Fine art print">
        <h3>Archival Print — “Origins”</h3>
        <p>Giclée on cotton rag</p>
        <p class="price">$85</p>
      </article>
      <article class="card">
        <img src="https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=800&q=80" alt="Art book">
        <h3>Studio Book</h3>
        <p>Hardcover collection</p>
        <p class="price">$48</p>
      </article>
      <article class="card">
        <img src="https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&w=800&q=80" alt="Inspiration cards">
        <h3>Inspiration Cards</h3>
        <p>Deck of 22 images</p>
        <p class="price">$32</p>
      </article>
      <article class="card">
        <img src="https://images.unsplash.com/photo-1547891654-e66ed7ebb968?auto=format&fit=crop&w=800&q=80" alt="Puzzle of a painting">
        <h3>Puzzle</h3>
        <p>1000 pieces</p>
        <p class="price">$42</p>
      </article>
    </div>
  </main>
  <footer data-footer></footer>
  <script src="site.js"></script>
</body>
</html>
