
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a09">
  <meta name="description" content="Borgazi — an exploration of art, consciousness, and the unseen.">
  <title>BORGAZI — Beyond the Visible</title>

  <style>
    :root {
      --black: #090a09;
      --surface: #111410;
      --gold: #b6a077;
      --cream: #e8e1d3;
      --muted: #88877b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--black);
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 28px 5vw 22px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 70% 45%,
          rgba(104, 100, 68, .12),
          transparent 48%
        ),
        linear-gradient(
          120deg,
          transparent 35%,
          rgba(255, 255, 255, .015),
          transparent 70%
        );
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 2;
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .logo {
      color: var(--cream);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .35em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .status::before {
      content: "";
      width: 5px;
      height: 5px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(182, 160, 119, .6);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1500px;
      margin: auto;
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      align-items: center;
      gap: 3vw;
      padding: 55px 0;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 30px 0;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 9px;
      letter-spacing: .32em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(64px, 8.3vw, 118px);
      font-weight: 400;
      line-height: .88;
      letter-spacing: -.075em;
    }

    h1 span {
      display: block;
      color: var(--gold);
      font-style: italic;
      font-weight: 400;
      margin-top: .15em;
    }

    .rule {
      height: 1px;
      width: 48px;
      background: var(--gold);
      margin: 35px 0 25px;
      opacity: .7;
    }

    .description {
      max-width: 300px;
      color: #a5a397;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      line-height: 1.9;
    }

    .signature {
      margin-top: 35px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    /* Original abstract celestial artwork */
    .visual {
      width: 100%;
      max-width: 680px;
      justify-self: center;
      position: relative;
    }

    .visual svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .orbit {
      transform-origin: 250px 250px;
      animation: rotate 90s linear infinite;
    }

    .glow {
      animation: breathe 8s ease-in-out infinite alternate;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes breathe {
      from { opacity: .45; }
      to { opacity: .9; }
    }

    .visual-caption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 0 5px;
      color: #77776a;
      font-size: 8px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    footer {
      border-top: 1px solid #292a24;
      padding-top: 20px;
      color: #77776a;
    }

    footer a {
      transition: color .25s;
    }

    footer a:hover {
      color: var(--gold);
    }

    .footer-right {
      display: flex;
      gap: 24px;
    }

    @media (max-width: 760px) {
      .page {
        padding: 24px 22px 18px;
      }

      header, footer {
        font-size: 8px;
        letter-spacing: .1em;
      }

      .logo {
        font-size: 11px;
        letter-spacing: .25em;
      }

      main {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 70px 0 45px;
      }

      .content {
        padding: 0;
      }

      .eyebrow {
        margin-bottom: 26px;
      }

      h1 {
        font-size: clamp(66px, 15vw, 100px);
      }

      .rule {
        margin: 25px 0 20px;
      }

      .description {
        font-size: 14px;
        max-width: 285px;
      }

      .signature {
        margin-top: 22px;
      }

      .visual {
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
      }

      .footer-right {
        gap: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <a class="logo" href="#" aria-label="Borgazi home">BORGAZI</a>
      <div class="status">Something is emerging</div>
    </header>

    <main>
      <section class="content">
        <div class="eyebrow">Art · Consciousness · The unseen</div>

        <h1>
          Beyond
          <span>the visible.</span>
        </h1>

        <div class="rule"></div>

        <p class="description">
          An exploration of the spaces between reality
          and imagination. A new body of work is
          slowly finding its form.
        </p>

        <div class="signature">The beginning is near</div>
      </section>

      <div class="visual">
        <svg viewBox="0 0 500 540"
             xmlns="http://www.w3.org/2000/svg"
             role="img"
             aria-label="Abstract golden eclipse surrounded by celestial geometry">

          <defs>
            <radialGradient id="aura">
              <stop offset="0" stop-color="#b6a077" stop-opacity=".25"/>
              <stop offset=".55" stop-color="#8e8059" stop-opacity=".08"/>
              <stop offset="1" stop-color="#090a09" stop-opacity="0"/>
            </radialGradient>

            <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4a4a3b"/>
              <stop offset=".5" stop-color="#20231d"/>
              <stop offset="1" stop-color="#10120f"/>
            </linearGradient>

            <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e0cc9e"/>
              <stop offset="1" stop-color="#7e704d"/>
            </linearGradient>

            <filter id="blur">
              <feGaussianBlur stdDeviation="20"/>
            </filter>
          </defs>

          <rect width="500" height="540" fill="transparent"/>

          <circle class="glow" cx="250" cy="245" r="190"
                  fill="url(#aura)"/>

          <circle cx="250" cy="245" r="138"
                  fill="none" stroke="#8f815d"
                  stroke-width=".6" opacity=".5"/>

          <circle cx="250" cy="245" r="160"
                  fill="none" stroke="#6d644b"
                  stroke-width=".5" stroke-dasharray="1 7"/>

          <g class="orbit" fill="none" stroke="url(#goldline)">
            <ellipse cx="250" cy="245" rx="100" ry="158"
                     stroke-width=".8" transform="rotate(35 250 245)"/>
            <ellipse cx="250" cy="245" rx="100" ry="158"
                     stroke-width=".8" transform="rotate(-35 250 245)"/>
          </g>

          <!-- Eclipse -->
          <circle cx="250" cy="205" r="75"
                  fill="#b6a077" opacity=".08"
                  filter="url(#blur)"/>

          <circle cx="250" cy="205" r="67"
                  fill="none" stroke="#c6b181"
                  stroke-width="1.1"/>

          <circle cx="250" cy="205" r="55"
                  fill="#090a09" stroke="#7e704d"
                  stroke-width=".6"/>

          <path d="M197 177
                   A61 61 0 0 1 303 177"
                fill="none" stroke="#d3bf90"
                stroke-width="1.5"/>

          <circle cx="250" cy="205" r="3"
                  fill="#d3bf90"/>

          <!-- Geometric rays -->
          <g stroke="#9c8a61" stroke-width=".7" opacity=".7">
            <path d="M250 105 V77"/>
            <path d="M250 305 V337"/>
            <path d="M150 205 H118"/>
            <path d="M350 205 H382"/>
            <path d="M179 134 L158 113"/>
            <path d="M321 134 L342 113"/>
            <path d="M179 276 L158 297"/>
            <path d="M321 276 L342 297"/>
          </g>

          <!-- Abstract monolith -->
          <path d="M181 465 L208 333 L274 319 L316 465 Z"
                fill="url(#stone)"
                stroke="#8b7c58" stroke-width=".8"/>

          <path d="M208 333 L250 357 L274 319"
                fill="none" stroke="#b6a077"
                stroke-width=".7" opacity=".65"/>

          <path d="M250 357 L250 451"
                stroke="#b6a077" stroke-width=".7" opacity=".4"/>

          <path d="M166 465 H332"
                stroke="#8b7c58" stroke-width=".7"/>

          <!-- Small stars -->
          <g fill="#c6b181">
            <circle cx="109" cy="171" r="1.3"/>
            <circle cx="375" cy="159" r="1.2"/>
            <circle cx="352" cy="351" r="1.4"/>
            <circle cx="132" cy="365" r="1"/>
            <circle cx="310" cy="86" r="1"/>
            <circle cx="185" cy="80" r="1.2"/>
          </g>

          <g stroke="#9c8a61" stroke-width=".6">
            <path d="M109 165 V177 M103 171 H115"/>
            <path d="M375 153 V165 M369 159 H381"/>
            <path d="M352 345 V357 M346 351 H358"/>
          </g>

          <text x="250" y="507"
                text-anchor="middle"
                fill="#89816d"
                font-family="Arial, sans-serif"
                font-size="8"
                letter-spacing="4">
            BETWEEN WORLDS
          </text>
        </svg>

        <div class="visual-caption">
          <span>Study 001</span>
          <span>Beyond form</span>
        </div>
      </div>
    </main>

    <footer>
      <span>Independent artistic practice</span>
      <div class="footer-right">
        <a href="https://www.instagram.com/borgazi/"
           target="_blank"
           rel="noopener noreferrer">Instagram ↗</a>
        <span>© <span id="year"></span> Borgazi</span>
      </div>
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
