<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORGAZI — Coming Soon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        void: '#050505',
                        ash: '#999999',
                        bone: '#f0f0f0',
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #f0f0f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .fade-in {
            animation: fadeIn 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between p-6 sm:p-12 lg:p-16 select-none bg-void text-bone overflow-x-hidden">

    <!-- Subtle ambient particles background canvas -->
    <canvas id="ambientCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-25"></canvas>

    <div class="relative z-10 min-h-[85vh] flex flex-col justify-between flex-grow max-w-2xl mx-auto w-full fade-in">

        <!-- Empty top spacer for perfect center alignment -->
        <div class="h-4"></div>

        <!-- Center Section: Title & Coming Soon -->
        <main class="my-auto py-16 text-center flex flex-col items-center justify-center space-y-6">
            <h1 class="font-serif text-5xl sm:text-7xl lg:text-8xl tracking-[0.2em] text-bone font-light uppercase pl-[0.2em]">
                BORGAZI
            </h1>

            <p class="font-sans text-xs sm:text-sm text-ash font-light tracking-[0.25em] uppercase">
                Website coming soon
            </p>
        </main>

        <!-- Footer: Mobile-Friendly Contact & Instagram -->
        <footer class="flex flex-col sm:flex-row items-center justify-between gap-4 font-sans text-xs sm:text-[11px] tracking-[0.2em] text-ash uppercase border-t border-white/10 pt-6 pb-2 text-center sm:text-left">
            <a href="mailto:contact@borgazi.art" class="hover:text-bone transition-colors duration-300 py-1">
                contact@borgazi.art
            </a>

            <div class="flex items-center justify-center gap-6 py-1">
                <a href="https://instagram.com/borgazi" target="_blank" rel="noopener noreferrer" class="hover:text-bone transition-colors duration-300">
                    Instagram
                </a>
            </div>
        </footer>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initAmbientCanvas();
        });

        let canvas, ctx, particles = [];

        function initAmbientCanvas() {
            canvas = document.getElementById('ambientCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            resizeCanvas();

            window.addEventListener('resize', resizeCanvas);

            particles = [];
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.0 + 0.2,
                    alpha: Math.random() * 0.25 + 0.05,
                    speedY: -(Math.random() * 0.12 + 0.02),
                    speedX: (Math.random() - 0.5) * 0.08
                });
            }

            renderParticles();
        }

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y < -10) {
                    p.y = canvas.height + 10;
                    p.x = Math.random() * canvas.width;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(240, 240, 240, ${p.alpha})`;
                ctx.fill();
            });

            requestAnimationFrame(renderParticles);
        }
    </script>
</body>
</html>
