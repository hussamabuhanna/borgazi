<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Borgazi ART</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <header class="site-header" data-header></header>
  <div class="scrim"></div>
  <main class="page">
    <h1 class="page-title">Contact</h1>
    <div class="contact-block">
      <h2>For prints, merchandise, or shipping: <a href="mailto:studio@borgazi.art">studio@borgazi.art</a></h2>
    </div>
    <div class="contact-block">
      <h2>For other enquiries: <a href="mailto:hello@borgazi.art">hello@borgazi.art</a></h2>
    </div>
    <form>
      <input type="text" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="message" rows="6" placeholder="Message" required></textarea>
      <button class="btn" type="submit">Send</button>
    </form>
  </main>
  <footer data-footer></footer>
  <script src="site.js"></script>
  <script>
    document.querySelector("form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      const name = encodeURIComponent(form.name.value);
      const email = encodeURIComponent(form.email.value);
      const message = encodeURIComponent(form.message.value);
      location.href = `mailto:hello@borgazi.art?subject=Studio%20enquiry%20from%20${name}&body=${message}%0A%0A${email}`;
    });
  </script>
</body>
</html>
